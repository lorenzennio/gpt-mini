[workspace]
authors = ["Lorenz Gaertner <lorenz.gaertner@gmail.com>"]
channels = ["conda-forge"]
name = "gpt-mini"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.6,<3.15"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
ipykernel = ">=7.3.0,<8"
# CPU-only torch from conda-forge (no GPU on this machine).
# cpu_generic build uses OpenBLAS, shared with numpy/scipy, avoiding a
# separate ~200 MB MKL download that the default cpu_mkl build pulls.
pytorch = { version = ">=2.12,<3", build = "cpu_generic*" }
