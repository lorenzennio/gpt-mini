[workspace]
authors = ["Lorenz Gaertner <lorenz.gaertner@gmail.com>"]
channels = ["conda-forge"]
name = "gpt-mini"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = ">=3.14.6,<3.15"
numpy = ">=2.5.1,<3"
scipy = ">=1.18.0,<2"
ipykernel = ">=7.3.0,<8"

[pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }
